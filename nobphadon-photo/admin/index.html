<script>
  // ดึงข้อมูลข้อความแนะนำตัว
  fetch('content/settings/hero.json')
    .then(response => response.json())
    .then(data => {
      if (data.title) document.getElementById('hero-title').innerText = data.title;
      if (data.description) document.getElementById('hero-desc').innerText = data.description;
    })
    .catch(err => console.log('Hero data not found'));

  // ดึงข้อมูลช่องทางติดต่อ
  fetch('content/settings/contact.json')
    .then(response => response.json())
    .then(data => {
      if (data.fb_link) {
        const fbEl = document.getElementById('fb-link');
        fbEl.href = data.fb_link;
        if (data.fb_name) fbEl.innerText = data.fb_name;
      }
      if (data.line_link) {
        const lineEl = document.getElementById('line-link');
        lineEl.href = data.line_link;
        if (data.line_name) lineEl.innerText = data.line_name;
      }
    })
    .catch(err => console.log('Contact data not found'));
</script>
